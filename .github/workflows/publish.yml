name: Publish npm packages
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish-0.1.0 to publish the verified candidate'
        required: true
        type: string
      ref:
        description: 'Verified tag or commit ref to publish'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: tenantguard-publish
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirm == 'publish-0.1.0'
    runs-on: ubuntu-24.04
    environment: npm-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            registry-url: https://registry.npmjs.org,
            cache: pnpm,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm test:examples
      - run: pnpm release:preflight
      - run: pnpm release:pack
      - run: pnpm -r publish --access public --no-git-checks --provenance --report-summary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
