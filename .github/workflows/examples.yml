name: Examples
on:
  push:
    paths:
      [
        'examples/**',
        'tests/examples.integration.ts',
        'packages/**',
        'pnpm-lock.yaml',
      ]
  pull_request:
    paths:
      [
        'examples/**',
        'tests/examples.integration.ts',
        'packages/**',
        'pnpm-lock.yaml',
      ]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f examples/compose/docker-compose.yml config
      - run: pnpm typecheck
      - run: pnpm test:examples
